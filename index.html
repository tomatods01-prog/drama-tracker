<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drama Tracker v3</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --panel: #ffffff;
      --ink: #111318;
      --muted: #6b7280;
      --subtle: #9ca3af;
      --line: #e5e7eb;
      --line-strong: #d1d5db;
      --accent: #e2553f;
      --accent-soft: #fff0ec;
      --accent-ink: #9f2f1c;
      --focus: #2563eb;
      --focus-soft: #eff6ff;
      --good: #16805a;
      --good-soft: #eaf8f1;
      --warn: #b56a00;
      --warn-soft: #fff7e6;
      --danger: #b42318;
      --danger-soft: #fff1f0;
      --shadow: 0 24px 70px rgba(17, 24, 39, 0.12);
      --soft-shadow: 0 12px 32px rgba(17, 24, 39, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% -10%, rgba(226, 85, 63, 0.16), transparent 30rem),
        radial-gradient(circle at 100% 0%, rgba(37, 99, 235, 0.12), transparent 26rem),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 48%, #eef1f7 100%);
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 28px;
      margin-bottom: 18px;
      background:
        linear-gradient(135deg, rgba(17, 19, 24, 0.98) 0%, rgba(40, 44, 56, 0.96) 68%, rgba(226, 85, 63, 0.88) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      box-shadow: var(--shadow);
      color: #ffffff;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: #ffb199;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      max-width: 580px;
      margin-top: 8px;
      color: #d9dde7;
      font-size: 15px;
      line-height: 1.45;
    }

    .header-side {
      display: grid;
      justify-items: end;
      gap: 8px;
    }

    .total-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      padding: 10px 13px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .total-pill strong {
      font-size: 20px;
    }

    .save-status {
      color: #d9dde7;
      font-size: 14px;
      white-space: nowrap;
    }

    .tracker-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 18px;
      align-items: start;
    }

    .main-column,
    .side-column {
      display: grid;
      gap: 14px;
    }

    .workspace-card {
      display: grid;
      gap: 14px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 18px;
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(14px);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .library-toolbar {
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) minmax(360px, 560px);
      align-items: center;
      gap: 16px;
    }

    .drag-note {
      justify-self: end;
      color: #8c8c8c;
      font-size: 13px;
      font-weight: 500;
    }

    .add-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: none;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 4px var(--focus-soft);
    }

    button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--line-strong);
      background: #faf8f5;
    }

    .primary {
      min-width: 120px;
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .primary:hover {
      background: #7f2a19;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow-x: auto;
      box-shadow: none;
    }

    .tab {
      min-width: 128px;
      border-color: transparent;
      padding: 0 16px;
      color: var(--muted);
      background: transparent;
    }

    .tab.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-ink);
      box-shadow: 0 6px 18px rgba(226, 85, 63, 0.12);
    }

    .tab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      min-height: 22px;
      padding: 0 6px;
      margin-left: 7px;
      border-radius: 999px;
      background: rgba(37, 33, 29, 0.08);
      font-size: 12px;
    }

    .summary {
      display: grid;
      gap: 10px;
    }

    .summary-item {
      position: relative;
      overflow: hidden;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--soft-shadow);
    }

    .summary-item::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--accent);
      content: "";
    }

    .summary-item:nth-child(2)::before {
      background: var(--warn);
    }

    .summary-item:nth-child(3)::before {
      background: var(--good);
    }

    .summary-number {
      display: block;
      margin-bottom: 4px;
      font-size: 30px;
      font-weight: 800;
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
    }

    .list {
      display: grid;
      gap: 14px;
    }

    .drama {
      position: relative;
      display: grid;
      grid-template-columns: 38px minmax(220px, 1fr) auto auto;
      align-items: center;
      gap: 18px;
      overflow: hidden;
      padding: 18px;
      background:
        linear-gradient(90deg, rgba(226, 85, 63, 0.08), transparent 42%),
        var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--soft-shadow);
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .drama::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: linear-gradient(180deg, var(--accent), #f59e0b);
      content: "";
    }

    .drama.dragging {
      opacity: 0.55;
      transform: scale(0.99);
    }

    .drama.drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft), var(--soft-shadow);
    }

    .drama:hover {
      border-color: var(--line-strong);
      box-shadow: 0 22px 42px rgba(17, 24, 39, 0.11);
      transform: translateY(-1px);
    }

    .drag-handle {
      display: grid;
      width: 38px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--subtle);
      cursor: grab;
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .drama-main {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: center;
      gap: 15px;
      min-width: 0;
    }

    .index-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(226, 85, 63, 0.18);
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-size: 14px;
      font-weight: 900;
    }

    .name {
      min-width: 0;
      font-size: clamp(24px, 2.4vw, 34px);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .row-meta {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-pill.archived,
    .archive {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .status-pill.completed,
    .complete {
      background: var(--good-soft);
      color: var(--good);
    }

    .episode-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .episode-stack {
      display: grid;
      gap: 7px;
      justify-items: center;
    }

    .episode-controls {
      display: grid;
      grid-template-columns: 38px 96px 38px;
      align-items: center;
      gap: 6px;
    }

    .episode-button {
      width: 38px;
      min-width: 38px;
      padding: 0;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1;
    }

    .episode-button:hover {
      color: var(--accent);
    }

    .episode-input {
      width: 96px;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      text-align: center;
    }

    .episode-input::-webkit-outer-spin-button,
    .episode-input::-webkit-inner-spin-button {
      margin: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .small {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .archive,
    .complete,
    .delete {
      border-color: transparent;
    }

    .delete {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .delete:hover {
      border-color: #ffc9c5;
      background: #ffe6e3;
    }

    .empty {
      padding: 42px 22px;
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      box-shadow: var(--soft-shadow);
    }

    .empty strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 18px;
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 20px, 1120px);
        padding-top: 20px;
      }

      header {
        display: block;
        padding: 20px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .header-side {
        justify-items: start;
        margin-top: 14px;
      }

      .add-panel,
      .drama {
        grid-template-columns: 1fr;
      }

      .drag-handle {
        width: 100%;
        height: 42px;
      }

      .tracker-shell {
        grid-template-columns: 1fr;
      }

      .side-column {
        order: -1;
      }

      .summary {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .summary-item {
        padding: 13px 12px;
      }

      .summary-number {
        font-size: 24px;
      }

      .tabs {
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .tab {
        min-width: max-content;
        flex: 1 0 auto;
      }

      .episode-controls {
        width: 100%;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
      }

      .episode-stack {
        justify-items: stretch;
      }

      .episode-button {
        width: 44px;
        min-width: 44px;
        min-height: 44px;
      }

      .episode-input {
        width: 100%;
      }

      .actions {
        justify-content: flex-start;
      }

      .name {
        font-size: clamp(28px, 8vw, 38px);
      }
    }

    @media (max-width: 520px) {
      .app {
        width: min(100% - 16px, 1120px);
      }

      header {
        border-radius: 18px;
      }

      h1 {
        font-size: 34px;
      }

      .add-panel,
      .summary {
        grid-template-columns: 1fr;
      }

      .tabs {
        gap: 6px;
      }

      .tab {
        min-width: 0;
        padding: 0 10px;
        font-size: 13px;
      }

      .tab-count {
        margin-left: 4px;
      }

      .drama {
        padding: 16px;
        border-radius: 18px;
      }

      .primary {
        width: 100%;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .small {
        width: 100%;
      }
    }

    @media (max-width: 980px) and (min-width: 761px) {
      .drama {
        grid-template-columns: 38px minmax(0, 1fr);
      }

      .episode-stack,
      .actions {
        grid-column: 2;
        justify-self: start;
      }
    }

    /* v2 polished desktop workspace */

      padding: 36px 0 56px;
    }

    header {
      min-height: 88px;
      margin: 0 0 20px;
      padding: 0 2px;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;

    header > div:first-child {

    h1 {

    .summary {

    .summary-item {
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      column-gap: 14px;
      align-content: center;
      padding: 22px 30px;
      text-align: left;
    }

    .summary-item + .summary-item {

    .summary-number {

    .drag-handle {

      .summary-item + .summary-item {
        border-top: 1px solid var(--v3-line);
        border-left: 0;
      }

      .library-toolbar {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
      }

      .tab {
        min-width: 0;
        padding: 0 6px;
        font-size: 12px;
      }

      .tab-count {
        min-width: 18px;
        min-height: 18px;
        margin-left: 4px;
        padding-inline: 4px;
      }

      .drag-note {
        display: none;
      }

      .add-panel {
        grid-column: auto;
        grid-template-columns: minmax(0, 1fr) 76px;
      }

      .add-panel .primary {
        min-width: 76px;
      }

      .list {
        padding: 0 14px 4px;
      }

      .drama {
        grid-template-columns: 1fr;
        gap: 11px;
        min-height: 0;
        padding: 17px 0;
      }

      .drag-handle {
        display: none;
      }

      .drama-main {
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 12px;
      }

      .index-mark {
        width: 38px;
        height: 38px;
      }

      .name {
        font-size: 22px;
      }

      .episode-stack,
      .actions {
        grid-column: auto;
      }

      .episode-controls {
        width: 100%;
      }

      .episode-input {
        flex: 1;
        width: auto;
      }

      .actions {
        width: 100%;
        margin-top: 0;
        padding: 0;
        border: 0;
        background: transparent;
        opacity: 1;
      }

      .small {
        min-height: 36px;
      }
    }

    /* v3 screenshot layout correction */
    .main-column,
    .side-column,
    .workspace-card,
    .library-toolbar,
    .list,
    .drama {
      min-width: 0;
    }

    .side-column {
      order: 0;
    }

    .summary {
      grid-template-columns: 1fr;
    }

    .summary-item + .summary-item {
      border-top: 1px solid var(--v3-line);
      border-left: 0;
    }

    @media (max-width: 1180px) and (min-width: 601px) {
      .summary {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .summary-item + .summary-item {
        border-top: 0;
        border-left: 1px solid var(--v3-line);
      }
    }

    /* v3 precision finish */
    button,
    input {
      font-family: inherit;
      touch-action: manipulation;
    }

    button {
      transition: color 140ms ease, background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, transform 100ms ease;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(23, 92, 211, 0.18);
      outline-offset: 2px;
    }

    .tab,
    .small,
    .drag-note,
    .save-status {
      white-space: nowrap;
    }

    .tab:hover:not(.active) {
      background: rgba(255, 255, 255, 0.72);
    }

    .primary:not(:disabled):hover {
      box-shadow: 0 2px 5px rgba(23, 92, 211, 0.2);
    }

    .primary:not(:disabled):active {
      box-shadow: none;
    }

    .name {
      transition: color 140ms ease;
    }

    .drama:hover .name,
    .drama:focus-within .name {
      color: #0f4fb8;
    }

    .episode-controls {
      overflow: hidden;
      border: 1px solid var(--v3-line-strong);
      background: #ffffff;
    }

    .episode-button,
    .episode-input {
      border-top: 0;
      border-bottom: 0;
    }

    .episode-button:first-child {
      border-left: 0;
    }

    .episode-button:last-child {
      border-right: 0;
    }

    .episode-input {
      -moz-appearance: textfield;
    }

    .episode-input::-webkit-inner-spin-button,
    .episode-input::-webkit-outer-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    .actions {
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
    }

    .small + .small {
      border-left: 1px solid var(--v3-line);
      border-radius: 0 4px 4px 0;
    }

    .small:first-child {
      border-radius: 4px 0 0 4px;
    }

    .small:only-child {
      border-radius: 4px;
    }

    @media (max-width: 1280px) and (min-width: 601px) {
      .tracker-shell {
        grid-template-columns: 1fr;
      }

      .side-column {
        grid-row: 1;
      }

      .summary {
        position: static;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .summary-item + .summary-item {
        border-top: 0;
        border-left: 1px solid var(--v3-line);
      }

      .library-toolbar {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .drag-note {
        justify-self: end;
      }

      .add-panel {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 600px) {
      .tab,
      .save-status {
        white-space: normal;
      }

      .actions {
        box-shadow: none;
      }

      .small + .small {
        border-left: 0;
        border-radius: 4px;
      }

      .small:first-child {
        border-radius: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <section class="app-content">
      <main class="app">
    <header>
      <div>
        <h1>Drama Tracker</h1>
        <div class="subtitle">Keep every episode, season, and finished series in one calm, focused view.</div>
      </div>
      <div class="header-side">
        <div class="total-pill"><strong id="totalCount">0</strong> titles</div>
        <div class="save-status" id="saveStatus" role="status" aria-live="polite">Saved in this browser</div>
      </div>
    </header>

    <div class="tracker-shell">
      <section class="main-column" aria-label="Drama list">
        <div class="workspace-card">
          <div class="library-toolbar">
            <nav class="tabs" aria-label="Drama status tabs">
              <button class="tab active" type="button" data-tab="watching" aria-pressed="true">Watching <span class="tab-count" id="watchingTabCount">0</span></button>
              <button class="tab" type="button" data-tab="archived" aria-pressed="false">Archived <span class="tab-count" id="archivedTabCount">0</span></button>
              <button class="tab" type="button" data-tab="completed" aria-pressed="false">Completed <span class="tab-count" id="completedTabCount">0</span></button>
            </nav>

            <span class="drag-note">Drag rows to reorder</span>

            <form class="add-panel" id="addForm" aria-label="Add a drama">
              <input id="dramaName" type="text" placeholder="Add a new drama or season" aria-label="Drama title" autocomplete="off" maxlength="120" required>
              <button class="primary" id="addButton" type="submit" disabled>Add</button>
            </form>
          </div>

          <div class="list-column-head" aria-hidden="true">
            <span>Order</span>
            <span>Drama</span>
            <span>Episode</span>
            <span>Actions</span>
          </div>

          <section class="list" id="dramaList" aria-live="polite"></section>
        </div>
      </section>

      <aside class="side-column" aria-label="Drama totals">
        <section class="summary">
          <div class="summary-item">
            <span class="summary-number" id="watchingCount">0</span>
            <span class="summary-label">Watching now</span>
          </div>
          <div class="summary-item">
            <span class="summary-number" id="archivedCount">0</span>
            <span class="summary-label">Waiting for upcoming season</span>
          </div>
          <div class="summary-item">
            <span class="summary-number" id="completedCount">0</span>
            <span class="summary-label">All seasons completed</span>
          </div>
        </section>
      </aside>
    </div>
      </main>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "drama-tracker-v1";
    const tabs = ["watching", "archived", "completed"];
    const tabLabels = {
      watching: "Watching",
      archived: "Archived",
      completed: "Completed"
    };
    const initialDramas = [
      { name: "摄影机不要停", episodes: 0 },
      { name: "吞噬星空", episodes: 219 },
      { name: "仙逆", episodes: 142 },
      { name: "繁花", episodes: 0 },
      { name: "山花烂漫时", episodes: 0 },
      { name: "Tour de France", episodes: 0 },
      { name: "沧元图第一季", episodes: 26 },
      { name: "一人之下 4", episodes: 0 },
      { name: "镖人", episodes: 15 },
      { name: "伍六七之玄武国", episodes: 0 },
      { name: "时光代理人 1", episodes: 11 },
      { name: "武动乾坤 3", episodes: 12 },
      { name: "雪鹰领主 3", episodes: 78 },
      { name: "雾山五行 2", episodes: 7 },
      { name: "一念永恒", episodes: 106 },
      { name: "星辰变 4", episodes: 80 },
      { name: "斩神 1", episodes: 15 },
      { name: "Demon Slayer: infinite", episodes: 0 },
      { name: "庆余年 2", episodes: 0 }
    ];
    const emptyMessages = {
      watching: "No dramas in Watching. Add a drama above to start tracking episodes.",
      archived: "No archived dramas. Move here when a season is completed and you are waiting for the next one.",
      completed: "No completed dramas yet."
    };

    let activeTab = "watching";
    let dramas = loadDramas();
    let draggedDramaId = "";

    const addForm = document.getElementById("addForm");
    const dramaName = document.getElementById("dramaName");
    const addButton = document.getElementById("addButton");
    const dramaList = document.getElementById("dramaList");
    const saveStatus = document.getElementById("saveStatus");

    addForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = dramaName.value.trim();

      if (!name) {
        return;
      }

      dramas.unshift({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name,
        episodes: 0,
        status: "watching",
        updatedAt: new Date().toISOString()
      });

      dramaName.value = "";
      addButton.disabled = true;
      activeTab = "watching";
      saveAndRender();
    });

    dramaName.addEventListener("input", () => {
      addButton.disabled = !dramaName.value.trim();
    });

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        activeTab = tab.dataset.tab;
        render();
      });
    });

    document.querySelector(".tabs").addEventListener("keydown", (event) => {
      const currentTab = event.target.closest(".tab");
      const navigationKeys = ["ArrowLeft", "ArrowRight", "Home", "End"];

      if (!currentTab || !navigationKeys.includes(event.key)) {
        return;
      }

      event.preventDefault();
      const tabButtons = Array.from(document.querySelectorAll(".tab"));
      const currentIndex = tabButtons.indexOf(currentTab);
      let nextIndex = currentIndex;

      if (event.key === "ArrowLeft") {
        nextIndex = (currentIndex - 1 + tabButtons.length) % tabButtons.length;
      }

      if (event.key === "ArrowRight") {
        nextIndex = (currentIndex + 1) % tabButtons.length;
      }

      if (event.key === "Home") {
        nextIndex = 0;
      }

      if (event.key === "End") {
        nextIndex = tabButtons.length - 1;
      }

      tabButtons[nextIndex].focus();
      tabButtons[nextIndex].click();
    });

    dramaList.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");

      if (!button) {
        return;
      }

      const drama = dramas.find((item) => item.id === button.dataset.id);

      if (!drama) {
        return;
      }

      if (button.dataset.action === "increase") {
        drama.episodes += 1;
      }

      if (button.dataset.action === "decrease") {
        drama.episodes = Math.max(0, drama.episodes - 1);
      }

      if (button.dataset.action === "move") {
        drama.status = button.dataset.status;
        activeTab = button.dataset.status;
      }

      if (button.dataset.action === "delete") {
        dramas = dramas.filter((item) => item.id !== drama.id);
        saveAndRender();
        return;
      }

      drama.updatedAt = new Date().toISOString();
      saveAndRender();
    });

    dramaList.addEventListener("change", (event) => {
      const input = event.target.closest("input[data-action='set-episode']");

      if (!input) {
        return;
      }

      const drama = dramas.find((item) => item.id === input.dataset.id);

      if (!drama) {
        return;
      }

      drama.episodes = Math.max(0, Number.parseInt(input.value, 10) || 0);
      drama.updatedAt = new Date().toISOString();
      saveAndRender();
    });

    dramaList.addEventListener("keydown", (event) => {
      const input = event.target.closest("input[data-action='set-episode']");

      if (input && event.key === "Enter") {
        event.preventDefault();
        input.blur();
      }
    });

    dramaList.addEventListener("dragstart", (event) => {
      const row = event.target.closest(".drama");

      if (!row) {
        return;
      }

      draggedDramaId = row.dataset.id;
      row.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedDramaId);
    });

    dramaList.addEventListener("dragend", () => {
      draggedDramaId = "";
      document.querySelectorAll(".drama").forEach((row) => {
        row.classList.remove("dragging", "drag-over");
      });
    });

    dramaList.addEventListener("dragover", (event) => {
      const row = event.target.closest(".drama");

      if (!row || !draggedDramaId || row.dataset.id === draggedDramaId) {
        return;
      }

      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      document.querySelectorAll(".drama.drag-over").forEach((item) => {
        item.classList.remove("drag-over");
      });
      row.classList.add("drag-over");
    });

    dramaList.addEventListener("dragleave", (event) => {
      const row = event.target.closest(".drama");

      if (!row || row.contains(event.relatedTarget)) {
        return;
      }

      row.classList.remove("drag-over");
    });

    dramaList.addEventListener("drop", (event) => {
      const row = event.target.closest(".drama");

      if (!row || !draggedDramaId || row.dataset.id === draggedDramaId) {
        return;
      }

      event.preventDefault();
      reorderDrama(draggedDramaId, row.dataset.id);
      draggedDramaId = "";
      saveAndRender();
    });

    function loadDramas() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const savedDramas = saved ? JSON.parse(saved) : [];
        const mergedDramas = mergeInitialDramas(savedDramas);

        if (mergedDramas.length !== savedDramas.length) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(mergedDramas));
        }

        return mergedDramas;
      } catch (error) {
        return mergeInitialDramas([]);
      }
    }

    function mergeInitialDramas(savedDramas) {
      const existingNames = new Set(savedDramas.map((drama) => drama.name.toLowerCase()));
      const createdAt = new Date().toISOString();
      const newDramas = initialDramas
        .filter((drama) => !existingNames.has(drama.name.toLowerCase()))
        .map((drama) => ({
          id: crypto.randomUUID ? crypto.randomUUID() : drama.name + "-" + Date.now(),
          name: drama.name,
          episodes: drama.episodes,
          status: "watching",
          updatedAt: createdAt
        }));

      return savedDramas.concat(newDramas);
    }

    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dramas));
      const savedAt = new Date();
      saveStatus.textContent = "Saved just now";
      saveStatus.title = "Saved " + savedAt.toLocaleString();
      render();
    }

    function reorderDrama(sourceId, targetId) {
      const activeDramas = dramas.filter((drama) => drama.status === activeTab);
      const otherDramas = dramas.filter((drama) => drama.status !== activeTab);
      const sourceIndex = activeDramas.findIndex((drama) => drama.id === sourceId);
      const targetIndex = activeDramas.findIndex((drama) => drama.id === targetId);

      if (sourceIndex < 0 || targetIndex < 0) {
        return;
      }

      const [movedDrama] = activeDramas.splice(sourceIndex, 1);
      const newTargetIndex = activeDramas.findIndex((drama) => drama.id === targetId);
      activeDramas.splice(newTargetIndex, 0, movedDrama);
      dramas = otherDramas.concat(activeDramas);
    }

    function render() {
      document.querySelectorAll(".tab").forEach((tab) => {
        const isActive = tab.dataset.tab === activeTab;
        tab.classList.toggle("active", isActive);
        tab.setAttribute("aria-pressed", String(isActive));
      });

      const watchingCount = countByStatus("watching");
      const archivedCount = countByStatus("archived");
      const completedCount = countByStatus("completed");

      document.getElementById("totalCount").textContent = dramas.length;
      document.getElementById("watchingCount").textContent = watchingCount;
      document.getElementById("archivedCount").textContent = archivedCount;
      document.getElementById("completedCount").textContent = completedCount;
      document.getElementById("watchingTabCount").textContent = watchingCount;
      document.getElementById("archivedTabCount").textContent = archivedCount;
      document.getElementById("completedTabCount").textContent = completedCount;

      const visibleDramas = dramas.filter((drama) => drama.status === activeTab);

      if (visibleDramas.length === 0) {
        dramaList.innerHTML = '<div class="empty"><strong>' + tabLabels[activeTab] + ' is clear</strong>' + emptyMessages[activeTab] + '</div>';
        return;
      }

      dramaList.innerHTML = visibleDramas.map(renderDrama).join("");
    }

    function renderDrama(drama, index) {
      const moveActions = tabs
        .filter((status) => status !== drama.status)
        .map((status) => {
          const className = status === "archived" ? "archive" : status === "completed" ? "complete" : "";
          const actionLabel = status === "archived" ? "Archive" : status === "completed" ? "Complete" : "Move to Watching";
          return '<button class="small ' + className + '" type="button" data-action="move" data-status="' + status + '" data-id="' + drama.id + '" aria-label="Move ' + escapeHtml(drama.name) + ' to ' + tabLabels[status] + '">' + actionLabel + '</button>';
        })
        .join("");
      const deleteAction = drama.status === "watching"
        ? '<button class="small delete" type="button" data-action="delete" data-id="' + drama.id + '">Delete</button>'
        : "";
      const actions = moveActions + deleteAction;

      return [
        '<article class="drama ' + drama.status + '" draggable="true" data-id="' + drama.id + '">',
          '<button class="drag-handle" type="button" aria-label="Drag to reorder ' + escapeHtml(drama.name) + '" title="Drag to reorder">::</button>',
          '<div class="drama-main">',
            '<div class="index-mark" aria-hidden="true">' + String(index + 1).padStart(2, "0") + '</div>',
            '<div>',
              '<div class="name">' + escapeHtml(drama.name) + '</div>',
              '<div class="row-meta">',
                '<span class="status-pill ' + drama.status + '">' + tabLabels[drama.status] + '</span>',
                '<span class="meta">Updated ' + formatDate(drama.updatedAt) + '</span>',
              '</div>',
            '</div>',
          '</div>',
          '<div class="episode-stack">',
            '<div class="episode-label">Episode</div>',
            '<div class="episode-controls" aria-label="Episode controls for ' + escapeHtml(drama.name) + '">',
              '<button class="episode-button" type="button" data-action="decrease" data-id="' + drama.id + '" aria-label="Decrease episode">-</button>',
              '<input class="episode-input" type="number" min="0" inputmode="numeric" value="' + drama.episodes + '" data-action="set-episode" data-id="' + drama.id + '" aria-label="Episode number">',
              '<button class="episode-button" type="button" data-action="increase" data-id="' + drama.id + '" aria-label="Increase episode">+</button>',
            '</div>',
          '</div>',
          '<div class="actions">' + actions + '</div>',
        '</article>'
      ].join("");
    }

    function countByStatus(status) {
      return dramas.filter((drama) => drama.status === status).length;
    }

    function formatDate(value) {
      if (!value) {
        return "just now";
      }

      return new Date(value).toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    render();
  </script>
</body>
</html>
